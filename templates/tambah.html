<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{{ "Edit" if mode == "edit" else "Tambah" }} Resep - Panduan Memasak</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a href="{{ url_for('index') }}" class="kembali">← Kembali ke daftar</a>

    <h1>{{ "✏️ Edit Resep" if mode == "edit" else "➕ Tambah Resep" }}</h1>

    {% if error %}
    <p class="error">⚠️ {{ error }}</p>
    {% endif %}

    {% set is_edit = (mode == "edit") %}

    <form method="POST" action="{{ url_for('edit', resep_id=resep.id) if is_edit else url_for('tambah') }}" class="form-tambah">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>
            Nama Resep
            <input type="text" name="nama" required value="{{ resep.nama if is_edit else '' }}" placeholder="misal: Soto Ayam">
        </label>

        <label>
            Kategori
            <select name="kategori">
                {% for k in kategori_list %}
                <option value="{{ k }}" {% if is_edit and resep.kategori == k %}selected{% endif %}>
                    {{ k }}
                </option>
                {% endfor %}
            </select>
        </label>

        <label>
            Waktu Memasak
            <input type="text" name="waktu" value="{{ resep.waktu if is_edit else '' }}" placeholder="misal: 30 menit">
        </label>

        <label>
            Bahan-bahan (satu per baris)
            <textarea name="bahan" rows="5" placeholder="2 butir telur&#10;3 sdm kecap manis">{{ resep.bahan|join('\n') if is_edit else '' }}</textarea>
        </label>

        <label>
            Langkah Memasak (satu per baris)
            <textarea name="langkah" rows="6" placeholder="Panaskan minyak.&#10;Tumis bawang hingga harum.">{{ resep.langkah|join('\n') if is_edit else '' }}</textarea>
        </label>

        <div class="aksi">
            <button type="submit">
                {{ "💾 Simpan Perubahan" if is_edit else "💾 Simpan Resep" }}
            </button>
            <a href="{{ url_for('index') }}" class="batal">Batal</a>
        </div>
    </form>
</body>
</html>
