{% extends 'base.html' %}

{% block title %}Pengaturan - Saji{% endblock %}

{% block content %}
    <a href="{{ url_for('profil', username=current_user.username) }}" class="btn-back">← Kembali ke Profil</a>

    <div class="form-header">
        <h1>Pengaturan Profil</h1>
        <p>Perbarui informasi publik kamu di Saji.</p>
    </div>

    <div class="form-container">
        <form method="POST" class="form-card">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            {% if error %}
            <div class="alert-danger">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ current_user.username }}" required maxlength="30">
                <span class="text-muted">Username unik kamu. Tidak boleh ada spasi.</span>
            </div>

            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" rows="4" placeholder="Ceritakan sedikit tentang dirimu..." maxlength="300">{{ current_user.bio or '' }}</textarea>
                <span class="text-muted">Maksimal 300 karakter.</span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary btn-lg">💾 Simpan Perubahan</button>
            </div>
        </form>
    </div>
{% endblock %}
