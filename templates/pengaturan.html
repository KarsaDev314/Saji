<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengaturan Profil - Panduan Memasak</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a href="{{ url_for('profil', username=current_user.username) }}" class="kembali">← Kembali ke profil</a>
    <h1>⚙️ Pengaturan Profil</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <p class="flash flash-{{ cat }}">{{ msg }}</p>
      {% endfor %}
    {% endwith %}

    {% if error %}
    <p class="error">⚠️ {{ error }}</p>
    {% endif %}

    <form method="POST" class="form-tambah" style="max-width:500px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            Username (3-30 karakter, tanpa spasi)
            <input type="text" name="username" required minlength="3" maxlength="30" value="{{ current_user.username }}">
        </label>

        <label>
            Bio (maksimal 300 karakter)
            <textarea name="bio" rows="4" maxlength="300" placeholder="Ceritakan sedikit tentang dirimu atau gaya memasakmu...">{{ current_user.bio }}</textarea>
        </label>

        <div class="aksi">
            <button type="submit">💾 Simpan Perubahan</button>
            <a href="{{ url_for('profil', username=current_user.username) }}" class="batal">Batal</a>
        </div>
    </form>
</body>
</html>
