{% extends 'base.html' %}

{% block title %}Login - Saji{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Sisi Kiri: Warna Orange -->
    <div class="auth-left">
        <div class="brand-showcase">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 16px;">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                    <path d="M3 11h18v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"></path>
                    <path d="M8 7c0-1.5 1-2 1-3"></path>
                    <path d="M12 7c0-1.5 1-2 1-3"></path>
                    <path d="M16 7c0-1.5 1-2 1-3"></path>
                </svg>
                Saji
            </h1>
            <p>Temukan inspirasi masakan, bagikan resep andalanmu, dan terhubung dengan pecinta kuliner lainnya.</p>
        </div>
    </div>

    <!-- Sisi Kanan: Form Login -->
    <div class="auth-right">
        <div class="auth-box">
            <h2>Masuk ke Saji</h2>
            
            {% if error %}
            <div class="alert-danger" style="margin-bottom: 16px; padding: 10px; background: #fff5f5; color: #c53030; border-radius: 8px;">{{ error }}</div>
            {% endif %}

            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" required autofocus>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn-primary w-full">Log In</button>
            </form>

            <div class="auth-footer">
                Belum punya akun? <a href="{{ url_for('register') }}">Daftar sekarang</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
